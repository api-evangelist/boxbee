name: Boxbee
description: Boxbee is an on-demand storage and reusable moving-box rental service operating
  across California, including the San Francisco Bay Area, San Jose, Oakland, Los Angeles,
  Orange County, the Inland Empire, and San Diego. It offers valet pickup-and-delivery
  storage, rentable reusable plastic moving crates for consumers and businesses, and an
  online inventory system for managing stored items. Boxbee originated as a 500 Startups
  and Google Ventures-backed app-based valet self-storage startup founded in 2012; after
  the by-the-box operation was sold, the brand continued as a regional storage and
  moving-supply provider. No public API or developer program is currently published.
